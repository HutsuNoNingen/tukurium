# Passwordless prototype: expose only the relay transport and its health endpoint.
location = /ws {
    auth_basic off;
    limit_req zone=kokoverse_api burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Kokosync-Bridge "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
}
location = /health {
    auth_basic off;
    proxy_pass http://127.0.0.1:8080/health;
}
location /api/ {
    auth_basic off;
    client_max_body_size 128m;
    limit_req zone=kokoverse_api burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
location = /api/v1/users {
    auth_basic off;
    client_max_body_size 1m;
    limit_req zone=kokoverse_registration burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/v1/users;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
